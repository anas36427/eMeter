<div class="data-card">
  <div class="table-responsive">
    <table class="table table-striped">
      <thead>
        <tr>
          <th>Name</th>
          <th>Meter No</th>
          <th>Consumer No</th>
          <th>Email</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        {% for consumer in consumers %}
        <tr>
          <td>{{ consumer.name }}</td>
          <td>{{ consumer.meter_number }}</td>
          <td>{{ consumer.consumer_number }}</td>
          <td>{{ consumer.email }}</td>
          <td>{{ consumer.status }}</td>
          <td>
            <a href="{% url 'manage_consumers' %}?edit={{ consumer.id }}" class="btn btn-sm btn-outline-primary">Edit</a>
          </td>
        </tr>
        {% empty %}
        <tr>
          <td colspan="6" class="text-center py-4">No consumers found</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
