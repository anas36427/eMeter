<div class="data-card">
  <div class="table-responsive">
    <table class="table table-hover">
      <thead>
        <tr>
          <th>Bill #</th>
          <th>Consumer</th>
          <th>Units</th>
          <th>Amount</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        {% for bill in bills %}
        <tr>
          <td>#{{ bill.bill_number }}</td>
          <td>{{ bill.consumer.name }}</td>
          <td>{{ bill.units }}</td>
          <td>₹{{ bill.total_amount|floatformat:2 }}</td>
          <td>{{ bill.status }}</td>
          <td>
            <a href="{% url 'download_bill_pdf' bill.id %}" class="btn btn-sm btn-outline-secondary">PDF</a>
          </td>
        </tr>
        {% empty %}
        <tr>
          <td colspan="6" class="text-center py-4">No bills found</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
